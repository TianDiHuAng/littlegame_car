<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>亮车计划 · 手感原型</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1520; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    height: min(100vh, 900px);
    width: min(100vw, calc(min(100vh, 900px) * 0.56), 520px);
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
  }
  @media (min-width: 560px) { #stage { border-radius: 22px; } }
  #game {
    display: block; width: 100%; height: 100%;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <script src="./assets.js"></script>
  <script src="./levels.js"></script>
  <script src="./game.js"></script>
</body>
</html>
