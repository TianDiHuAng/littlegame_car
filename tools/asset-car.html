<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 手绘感：用噪声位移把矢量的死板边缘推歪一点 -->
    <filter id="wobble" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobbleSoft" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blurBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurMid" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d86"/>
      <stop offset="0.42" stop-color="#f4634c"/>
      <stop offset="1" stop-color="#c33f2b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3a0"/>
      <stop offset="1" stop-color="#f4634c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.5" stop-color="#a9cdea"/>
      <stop offset="1" stop-color="#7aa8cd"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.34"/>
    </linearGradient>

    <!-- 只保留车身的区域，给高光和噪点用 -->
    <clipPath id="carClip">
      <path d="M150 452 L150 356 Q150 322 186 318 L262 312
               Q300 214 372 200 Q470 190 560 200 Q636 212 660 312
               L742 320 Q786 324 786 358 L786 452 Z"/>
    </clipPath>
  </defs>

  <!-- 接地阴影 -->
  <ellipse cx="470" cy="512" rx="330" ry="46" fill="#2a3a33" opacity="0.20" filter="url(#blurBig)"/>
  <ellipse cx="470" cy="508" rx="215" ry="26" fill="#24332c" opacity="0.24" filter="url(#blurMid)"/>

  <g filter="url(#wobble)">
    <!-- 车身 -->
    <path d="M150 452 L150 356 Q150 322 186 318 L262 312
             Q300 214 372 200 Q470 190 560 200 Q636 212 660 312
             L742 320 Q786 324 786 358 L786 452 Z"
          fill="url(#body)"/>

    <!-- 车顶 -->
    <path d="M262 314 Q300 216 372 202 Q470 192 560 202 Q636 214 660 314 Z"
          fill="url(#roof)"/>

    <!-- 车窗 -->
    <path d="M286 304 Q318 226 380 214 Q446 206 500 208 L500 304 Z" fill="url(#glass)"/>
    <path d="M516 208 Q580 212 640 226 L648 304 L516 304 Z" fill="url(#glass)"/>

    <!-- B 柱 -->
    <rect x="500" y="206" width="16" height="100" fill="#cf432d"/>

    <!-- 玻璃反光 -->
    <path d="M300 300 L330 220 L352 222 L320 300 Z" fill="#ffffff" opacity="0.34"/>
    <path d="M536 300 L560 218 L580 220 L556 300 Z" fill="#ffffff" opacity="0.26"/>

    <!-- 车灯 -->
    <rect x="762" y="352" width="26" height="34" rx="10" fill="#ffe9a8"/>
    <rect x="150" y="360" width="18" height="26" rx="8" fill="#e8564a"/>

    <!-- 腰线 -->
    <path d="M170 392 L768 392" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 车顶高光带（不参与位移，边缘干净一点） -->
  <g clip-path="url(#carClip)">
    <rect x="140" y="196" width="660" height="120" fill="url(#chrome)" opacity="0.55"/>
    <rect x="140" y="300" width="660" height="160" fill="#ffffff" opacity="0.0"/>
  </g>

  <!-- 轮拱阴影 -->
  <g filter="url(#wobbleSoft)">
    <ellipse cx="300" cy="452" rx="86" ry="30" fill="#8f2a1c" opacity="0.30"/>
    <ellipse cx="660" cy="452" rx="86" ry="30" fill="#8f2a1c" opacity="0.30"/>
  </g>

  <!-- 轮子 -->
  <g>
    <circle cx="300" cy="452" r="78" fill="#23262c"/>
    <circle cx="300" cy="452" r="78" fill="none" stroke="#3a3f47" stroke-width="4"/>
    <path d="M300 374 a78 78 0 0 1 62 125" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="12" stroke-linecap="round"/>
    <circle cx="300" cy="452" r="40" fill="#dfe6ee"/>
    <circle cx="300" cy="452" r="40" fill="none" stroke="#b9c4d1" stroke-width="3"/>
    <circle cx="300" cy="452" r="13" fill="#8e9aa8"/>
    <g fill="#b9c4d1">
      <rect x="296" y="414" width="8" height="20" rx="4" transform="rotate(0 300 452)"/>
      <rect x="296" y="414" width="8" height="20" rx="4" transform="rotate(72 300 452)"/>
      <rect x="296" y="414" width="8" height="20" rx="4" transform="rotate(144 300 452)"/>
      <rect x="296" y="414" width="8" height="20" rx="4" transform="rotate(216 300 452)"/>
      <rect x="296" y="414" width="8" height="20" rx="4" transform="rotate(288 300 452)"/>
    </g>
  </g>
  <g>
    <circle cx="660" cy="452" r="78" fill="#23262c"/>
    <circle cx="660" cy="452" r="78" fill="none" stroke="#3a3f47" stroke-width="4"/>
    <path d="M660 374 a78 78 0 0 1 62 125" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="12" stroke-linecap="round"/>
    <circle cx="660" cy="452" r="40" fill="#dfe6ee"/>
    <circle cx="660" cy="452" r="40" fill="none" stroke="#b9c4d1" stroke-width="3"/>
    <circle cx="660" cy="452" r="13" fill="#8e9aa8"/>
    <g fill="#b9c4d1">
      <rect x="656" y="414" width="8" height="20" rx="4" transform="rotate(0 660 452)"/>
      <rect x="656" y="414" width="8" height="20" rx="4" transform="rotate(72 660 452)"/>
      <rect x="656" y="414" width="8" height="20" rx="4" transform="rotate(144 660 452)"/>
      <rect x="656" y="414" width="8" height="20" rx="4" transform="rotate(216 660 452)"/>
      <rect x="656" y="414" width="8" height="20" rx="4" transform="rotate(288 660 452)"/>
    </g>
  </g>

  <!-- 底部暗部（压住轮子交界） -->
  <g clip-path="url(#carClip)" opacity="0.35">
    <rect x="140" y="430" width="660" height="40" fill="#7a2317"/>
  </g>
</svg>
</body>
</html>
